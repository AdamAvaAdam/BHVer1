function programKey(p){return String(p.km||'-').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();}
function comparePrices(current,previous){
 const old=new Map(previous.map(i=>[i.key,i]));
 for(const item of current){const before=old.get(item.key);item.hasPriceChange=false;item.removedPrograms=0;
  for(const p of item.programs){
   if(!before){p.comparison={text:'Mã mới',changed:true};continue;}
   const same=before.programs.filter(q=>programKey(q)===programKey(p));
   const currentSame=item.programs.filter(q=>programKey(q)===programKey(p));
   if(!same.length){p.comparison={text:'CT mới',changed:true};continue;}
   if(same.length!==1||currentSame.length!==1){
    const a=same.map(q=>q.price).sort((x,y)=>x-y),b=currentSame.map(q=>q.price).sort((x,y)=>x-y);
    const changed=JSON.stringify(a)!==JSON.stringify(b);
    p.comparison={text:changed?'Nhiều mức cùng CT · cần đối chiếu':'Không đổi · nhiều mức cùng CT',changed};continue;
   }
   const delta=p.price-same[0].price;
   p.comparison={text:delta===0?'Không đổi':(delta<0?'↓ ':'↑ ')+money(Math.abs(delta))+' · Cũ: '+money(same[0].price),changed:delta!==0};
  }
  if(before){const labels=new Set(item.programs.map(programKey));item.removedPrograms=new Set(before.programs.filter(p=>!labels.has(programKey(p))).map(programKey)).size;}
  item.hasPriceChange=item.programs.some(p=>p.comparison.changed)||item.removedPrograms>0;
  item.change=item.removedPrograms?'Bớt '+item.removedPrograms+' CT so với bảng trước':'';
 }
 return previous.filter(i=>!current.some(n=>n.key===i.key)).length;
}

async function weatherFor(region){let loc=REGIONS.find(([n])=>n===region),cacheKey='VT_WEATHER_MET_'+loc[1]+'_'+loc[2],cached=null;try{cached=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cached?.expires>Date.now())return {...E.weatherDaily(cached.payload),stale:Date.now()-cached.savedAt>6*3600000};}catch{}
let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),16000);try{let response=await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${loc[1].toFixed(4)}&lon=${loc[2].toFixed(4)}`,{signal:ctl.signal,credentials:'omit'});if(!response.ok)throw Error('HTTP '+response.status);let payload=await response.json(),parsed=E.weatherDaily(payload),savedAt=Date.now(),exp=Date.parse(response.headers.get('Expires')||''),expires=Math.max(savedAt+3600000,Number.isFinite(exp)?exp:0);try{localStorage.setItem(cacheKey,JSON.stringify({payload,savedAt,expires}));}catch{}return {...parsed,stale:false};}finally{clearTimeout(timer);}}
async function loadWeather(){let generation=++state.generation,recentCustomers=new Set(state.orders.filter(l=>E.day(E.currentDay())-E.day(l.date)<30).map(l=>l.customer)),regions=[...new Set([...recentCustomers].map(id=>regionFor(id,state.customers.get(id))).filter(Boolean))];state.weatherBusy=regions.length>0;state.weatherTotal=regions.length;state.weatherDone=0;state.weatherErrors=0;renderBoard();let cursor=0;async function worker(){while(cursor<regions.length){let region=regions[cursor++];try{let w=await weatherFor(region);if(generation!==state.generation)return;state.weatherMap.set(region,w);if(w.stale)state.weatherErrors++;}catch{if(generation!==state.generation)return;state.weatherMap.delete(region);state.weatherErrors++;}if(generation!==state.generation)return;state.weatherDone++;renderBoard();await new Promise(r=>setTimeout(r,350));}}await Promise.all([worker(),worker()]);if(generation===state.generation){state.weatherBusy=false;renderBoard();}}
