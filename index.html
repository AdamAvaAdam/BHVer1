<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Việt Tuấn · Báo giá nhanh</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#17283d;background:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;padding-bottom:90px}
header{background:#123d71;color:white;padding:16px max(16px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;gap:15px;align-items:center}
h1{font-size:20px;margin:0 0 4px}
small{font-size:12px}
main{max-width:1180px;margin:auto;padding:12px}
.toolbar{position:sticky;top:0;background:#f1f5f9;z-index:2;padding:8px 0;display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:220px;padding:13px;border:1px solid #c8d4e0;border-radius:9px;font-size:16px}
button,select{font:inherit;border:1px solid #c8d4e0;border-radius:7px;padding:9px 12px;background:white;color:#183b64;cursor:pointer}
button:hover{background:#eaf2fc}
button:disabled{opacity:.5;cursor:wait}
.primary{background:#1764cc;color:white;border-color:#1764cc}
.primary:hover{background:#104eaa}
.chips{display:flex;gap:6px;overflow:auto;padding:3px 0 10px}
.chips button{white-space:nowrap;font-size:13px}
.chips .active{background:#183f70;color:white}
.status{font-size:12px;line-height:1.6;color:#53657b;margin:5px 0 12px}
.error{color:#af2929}
.list{display:grid;gap:10px}
.card{border:1px solid #d5dfea;border-radius:10px;background:white;overflow:hidden}
.card.selected{border-color:#1764cc;box-shadow:0 0 0 1px #1764cc}
.row{display:grid;grid-template-columns:28px 1fr 110px 190px;align-items:start;gap:12px;padding:15px}
.check{width:19px;height:19px;margin:4px 0;cursor:pointer}
.model{font-size:17px;font-weight:750;color:#143f75}
.name{font-size:14px;margin:4px 0}
.spec{font-size:12px;color:#627187;white-space:pre-line}
.stock{font-size:14px;font-weight:600}
.muted{color:#7b8796}
.price{font-weight:750;font-size:20px;color:#bd3028}
.program{font-size:12px;white-space:pre-line;margin:5px 0 8px;color:#506078}
.badge{display:inline-block;font-size:11px;background:#fff0ce;color:#855200;padding:3px 6px;border-radius:4px;margin-top:6px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tools button{font-size:12px;padding:6px 8px}
.sub{margin:0 15px 12px;padding-top:8px;border-top:1px solid #e1e8f0}
.subline{display:grid;grid-template-columns:28px 150px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f6}
.subline:last-child{border:0}
.subprice{font-weight:700}
.best{color:#bd3028}
.empty{padding:40px;text-align:center;background:white;border-radius:10px;color:#617086}
footer{position:fixed;bottom:0;left:0;right:0;background:#12345a;color:white;display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100% - 1180px)/2));gap:10px;z-index:3}
footer div{display:flex;gap:8px;align-items:center}
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#17283d;color:white;border-radius:8px;padding:12px 18px;z-index:10;max-width:90%;display:none}
dialog{border:0;border-radius:12px;width:min(580px,94vw);padding:20px}
dialog::backdrop{background:#0008}
textarea{width:100%;min-height:220px;font:14px Segoe UI;padding:10px;margin:12px 0;border:1px solid #bccbdc;border-radius:6px}
dialog h2{font-size:18px;margin-top:0}
@media(max-width:650px){
  header{padding:13px}
  h1{font-size:18px}
  .row{grid-template-columns:25px 1fr;gap:8px;padding:12px}
  .stock,.quote{grid-column:2}
  .price{font-size:21px}
  .subline{grid-template-columns:24px 1fr auto}
  .subline .program{grid-column:2 / 4;grid-row:2}
  .toolbar button,.toolbar select{font-size:12px;padding:8px}
  footer{padding:10px;font-size:12px}
  footer button{font-size:12px;padding:10px}
  .sub{margin:0 12px 10px}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>VIỆT TUẤN · BÁO GIÁ NHANH</h1>
    <small>Tra mã · Xem tồn · Copy giá</small>
  </div>
  <button id="reload">↻ MỚI</button>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search"
      placeholder="Tìm mã, tên hàng, thông số…" autocomplete="off">
    <select id="stockFilter">
      <option value="available">Còn hàng</option>
      <option value="all">Tất cả tồn</option>
      <option value="unknown">Chưa rõ tồn</option>
    </select>
    <button id="selectAll">Chọn tất cả</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="status" id="status" role="status">Đang tải dữ liệu…</div>
  <div class="list" id="list"></div>
</main>

<footer>
  <span>Đã chọn: <b id="count">0</b> mức giá</span>
  <div>
    <button id="reset">Bỏ chọn</button>
    <button class="primary" id="copySelected">📋 COPY BÁO GIÁ</button>
  </div>
</footer>

<div id="toast" role="status"></div>

<dialog id="manual">
  <h2>Copy nội dung</h2>
  <div>
    Trình duyệt chưa cho phép copy tự động.
    Chọn nội dung bên dưới để sao chép.
  </div>
  <textarea id="manualText" readonly></textarea>
  <button id="closeManual">Đóng</button>
</dialog>

<dialog id="specDialog">
  <h2 id="specTitle">Thông số riêng trên thiết bị</h2>
  <small>Để trống rồi lưu để dùng lại thông số từ Sheets.</small>
  <textarea id="specInput"></textarea>
  <button id="saveSpec" class="primary">Lưu</button>
  <button id="cancelSpec">Hủy</button>
</dialog>

<script>
'use strict';

const BASE =
  'https://docs.google.com/spreadsheets/d/e/' +
  '2PACX-1vS1k5jVGEaXBRv9EOrUqSiTDJ7IrwWHIsTl3KrnYWArTrpZ17gLORwN06RqLUI6Y7My_Xs6OL6Es1Bl' +
  '/pub?single=true&output=csv&gid=';

const SOURCES = {
  stock: BASE + '656473693',
  price: BASE + '1327420648',
  specs: BASE + '1649169229'
};

const $ = id => document.getElementById(id);

const key = s => String(s ?? '')
  .normalize('NFKC')
  .trim()
  .toUpperCase()
  .replace(/[\s\-‐‑–—]/g, '');

const fold = s => String(s ?? '')
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '')
  .replace(/đ/g, 'd')
  .replace(/Đ/g, 'D')
  .toLowerCase();

const compact = s => fold(s).replace(/[^a-z0-9]/g, '');
const money = n => n.toLocaleString('vi-VN') + 'đ';

let items = [];
let visible = [];
let selected = new Set();
let opened = new Set();
let brand = '';
let loading = false;
let editing = null;
let lastSync = '';
let loadNote = '';
let custom = {};

try {
  const value = JSON.parse(
    localStorage.getItem('CUSTOM_SPECS_CACHE') || '{}'
  );

  if (value && typeof value === 'object' && !Array.isArray(value)) {
    custom = value;
  }
} catch {}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === ',' && !quoted) {
      row.push(cell.trim());
      cell = '';
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && text[i + 1] === '\n') i++;

      row.push(cell.trim());

      if (row.some(Boolean)) rows.push(row);

      row = [];
      cell = '';
    } else {
      cell += c;
    }
  }

  if (quoted) {
    throw Error('CSV có ô chưa đóng dấu ngoặc kép');
  }

  row.push(cell.trim());
  if (row.some(Boolean)) rows.push(row);

  if (rows[0]) {
    rows[0][0] = rows[0][0].replace(/^\uFEFF/, '');
  }

  return rows;
}

function stockNumber(value) {
  let text = String(value ?? '').trim().replace(/\s/g, '');

  if (!text || !/^-?[\d.,]+$/.test(text)) return null;

  if (text.includes(',') && text.includes('.')) {
    text = text.replace(/\./g, '').replace(',', '.');
  } else if (text.includes(',')) {
    text = text.replace(',', '.');
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(text)) {
    text = text.replace(/\./g, '');
  }

  const number = Number(text);
  return Number.isFinite(number) ? number : null;
}

function priceNumber(value) {
  const text = String(value ?? '').trim();

  if (!/^\d[\d.,\s]*(?:đ|₫|vnd)?$/i.test(text)) return null;

  const number = Number(text.replace(/[^\d]/g, ''));

  return Number.isSafeInteger(number) && number > 0
    ? number
    : null;
}

function isToday(value) {
  const match = String(value).match(
    /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})(?:\s|$)/
  );

  if (!match) return false;

  const today = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Bangkok',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  }).format(new Date()).split('/');

  const year = +match[3] < 100
    ? 2000 + Number(match[3])
    : Number(match[3]);

  return Number(match[1]) === Number(today[0]) &&
    Number(match[2]) === Number(today[1]) &&
    year === Number(today[2]);
}

function el(tag, className, text) {
  const node = document.createElement(tag);

  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;

  return node;
}

function button(text, handler, className) {
  const node = el('button', className, text);
  node.type = 'button';
  node.addEventListener('click', handler);
  return node;
}

function toast(text) {
  $('toast').textContent = text;
  $('toast').style.display = 'block';

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    $('toast').style.display = 'none';
  }, 2600);
}

async function fetchCSV(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);

  try {
    const response = await fetch(url, {
      cache: 'no-store',
      signal: controller.signal
    });

    if (!response.ok) {
      throw Error('HTTP ' + response.status);
    }

    const text = await response.text();

    if (/^\s*</.test(text)) {
      throw Error('Nguồn không trả về CSV');
    }

    return parseCSV(text);
  } finally {
    clearTimeout(timer);
  }
}

function buildData(stockRows, priceRows, specRows) {
  const stocks = new Map();
  const specs = new Map();
  const groups = new Map();
  const occurrences = new Map();

  let invalid = 0;
  let duplicates = 0;

  for (const columns of stockRows.slice(1)) {
    const modelKey = key(columns[0]);
    if (!modelKey) continue;

    const quantity = stockNumber(columns[3]);

    if (stocks.has(modelKey)) {
      stocks.set(modelKey, null);
      duplicates++;
    } else {
      stocks.set(modelKey, quantity);
    }
  }

  for (const columns of specRows.slice(1)) {
    const modelKey = key(columns[0]);

    if (modelKey) {
      specs.set(modelKey, columns[2] || '');
    }
  }

  for (const columns of priceRows.slice(1)) {
    const modelKey = key(columns[0]);
    if (!modelKey) continue;

    const price = priceNumber(columns[5]);

    if (price === null) {
      invalid++;
      continue;
    }

    const name = columns[1] || columns[0];
    const promotion = columns[8] || '-';
    const date = columns[6] || '';

    const signature = JSON.stringify([
      modelKey, price, promotion, date
    ]);

    const occurrence = (occurrences.get(signature) || 0) + 1;
    occurrences.set(signature, occurrence);

    const program = {
      id: signature + '#' + occurrence,
      price,
      km: promotion,
      date,
      newToday: isToday(date)
    };

    if (!groups.has(modelKey)) {
      groups.set(modelKey, {
        key: modelKey,
        model: columns[0],
        name,
        stock: stocks.has(modelKey)
          ? stocks.get(modelKey)
          : null,
        sheetSpec: specs.get(modelKey) || '',
        programs: []
      });
    }

    groups.get(modelKey).programs.push(program);
  }

  for (const item of groups.values()) {
    item.programs.sort((a, b) => b.price - a.price);

    item.default = item.programs.find(program =>
      fold(program.km).includes('le')
    ) || item.programs[0];

    item.min = Math.min(
      ...item.programs.map(program => program.price)
    );

    const oldSpecKey = String(item.model)
      .trim()
      .toUpperCase()
      .normalize();

    item.spec = custom[item.key] ||
      custom[oldSpecKey] ||
      item.sheetSpec;
  }

  return {
    data: [...groups.values()],
    invalid,
    duplicates
  };
}

async function load() {
  if (loading) return;

  loading = true;
  $('reload').disabled = true;
  $('copySelected').disabled = true;
  $('status').textContent = 'Đang cập nhật giá và tồn…';

  try {
    const results = await Promise.allSettled([
      fetchCSV(SOURCES.stock),
      fetchCSV(SOURCES.price),
      fetchCSV(SOURCES.specs)
    ]);

    if (
      results[0].status === 'rejected' ||
      results[1].status === 'rejected'
    ) {
      const failed = [
        results[0].status === 'rejected' ? 'tồn kho' : '',
        results[1].status === 'rejected' ? 'bảng giá' : ''
      ].filter(Boolean);

      throw Error('Không tải được ' + failed.join(' và '));
    }

    const specFailed = results[2].status === 'rejected';

    const built = buildData(
      results[0].value,
      results[1].value,
      specFailed ? [] : results[2].value
    );

    if (!built.data.length) {
      throw Error(
        'Không có dòng giá hợp lệ. Cần kiểm tra nguồn Sheets.'
      );
    }

    const old = new Map(items.map(item => [item.key, item]));

    for (const item of built.data) {
      const previous = old.get(item.key);

      if (previous) {
        const changes = [];

        if (previous.stock !== item.stock) {
          changes.push('Tồn đổi');
        }

        const previousPrograms = JSON.stringify(
          previous.programs.map(program => [
            program.price, program.km, program.date
          ]).sort()
        );

        const currentPrograms = JSON.stringify(
          item.programs.map(program => [
            program.price, program.km, program.date
          ]).sort()
        );

        if (previousPrograms !== currentPrograms) {
          changes.push('Giá / CT đổi');
        }

        item.change = changes.join(' · ');
      } else if (old.size) {
        item.change = 'Mã mới';
      }
    }

    const hadSelection = selected.size > 0;

    items = built.data;
    selected.clear();
    opened.clear();

    lastSync = new Date().toLocaleTimeString('vi-VN', {
      timeZone: 'Asia/Bangkok',
      hour: '2-digit',
      minute: '2-digit'
    });

    loadNote = [
      specFailed ? 'Chưa tải được thông số.' : '',
      built.invalid
        ? built.invalid + ' dòng giá không hợp lệ đã bỏ qua.'
        : '',
      built.duplicates
        ? 'Có mã tồn trùng: tạm ghi chưa rõ tồn để tránh cộng sai.'
        : ''
    ].filter(Boolean).join(' ');

    filter();

    if (hadSelection) {
      toast(
        'Đã cập nhật. Lựa chọn cũ được bỏ để tránh báo nhầm.'
      );
    }
  } catch (error) {
    $('status').textContent = error.message + (
      items.length
        ? ' · Đang giữ dữ liệu cũ từ ' + lastSync + '.'
        : ' · Bấm MỚI để thử lại.'
    );

    $('status').classList.add('error');

    if (!items.length) {
      $('list').replaceChildren(
        el(
          'div',
          'empty',
          'Chưa tải được dữ liệu. Kiểm tra kết nối và quyền xuất bản Sheets.'
        )
      );
    }
  } finally {
    loading = false;
    $('reload').disabled = false;
    $('copySelected').disabled = false;
  }
}

function filter() {
  const words = fold($('search').value)
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  visible = items.filter(item => {
    const target = fold([
      item.model,
      item.name,
      item.spec,
      ...item.programs.map(program => program.km)
    ].join(' '));

    const matchesSearch = words.every(word =>
      target.includes(word) ||
      (
        compact(word) !== '' &&
        compact(item.model).includes(compact(word))
      )
    );

    const matchesBrand = !brand ||
      target.includes(fold(brand));

    const stockFilter = $('stockFilter').value;

    const matchesStock = stockFilter === 'all' ||
      (
        stockFilter === 'unknown'
          ? item.stock === null
          : item.stock !== null && item.stock > 0
      );

    return matchesSearch && matchesBrand && matchesStock;
  });

  render();
}

function toggle(item) {
  const hasSelected = item.programs.some(program =>
    selected.has(program.id)
  );

  if (hasSelected) {
    item.programs.forEach(program => {
      selected.delete(program.id);
    });
  } else {
    selected.add(item.default.id);
  }

  render();
}

function check(checked, handler, label) {
  const input = el('input', 'check');

  input.type = 'checkbox';
  input.checked = checked;
  input.setAttribute('aria-label', label);
  input.addEventListener('change', handler);

  return input;
}

function render() {
  const fragment = document.createDocumentFragment();

  for (const item of visible) {
    const anySelected = item.programs.some(program =>
      selected.has(program.id)
    );

    const card = el(
      'article',
      'card' + (anySelected ? ' selected' : '')
    );

    const row = el('div', 'row');

    const mainCheck = check(
      anySelected,
      () => toggle(item),
      'Chọn ' + item.model
    );

    mainCheck.indeterminate = anySelected &&
      !selected.has(item.default.id);

    row.append(mainCheck);

    const info = el('div');

    info.append(
      el('div', 'model', item.model),
      el('div', 'name', item.name)
    );

    if (item.spec) {
      info.append(el('div', 'spec', item.spec));
    }

    if (item.change) {
      info.append(el('span', 'badge', item.change));
    }

    const tools = el('div', 'tools');

    if (item.programs.length > 1) {
      tools.append(
        button(
          (opened.has(item.key) ? '▴ Ẩn' : '▾ Xem') +
            ' ' + item.programs.length + ' mức giá',
          () => {
            if (opened.has(item.key)) {
              opened.delete(item.key);
            } else {
              opened.add(item.key);
            }

            render();
          }
        )
      );
    }

    tools.append(
      button('Thông số', () => {
        editing = item;

        $('specTitle').textContent =
          'Thông số · ' + item.model;

        $('specInput').value = item.spec;
        $('specDialog').showModal();
      })
    );

    info.append(tools);
    row.append(info);

    const stockText = item.stock === null
      ? 'Tồn: chưa rõ'
      : 'Tồn: ' + item.stock.toLocaleString('vi-VN');

    row.append(
      el(
        'div',
        'stock' + (
          item.stock === null || item.stock <= 0
            ? ' muted'
            : ''
        ),
        stockText
      )
    );

    const quote = el('div', 'quote');

    quote.append(
      el('div', 'price', money(item.default.price)),
      el('div', 'program', item.default.km),
      button(
        '📋 Copy giá',
        () => copyText(singleText(item, item.default)),
        'primary'
      )
    );

    row.append(quote);
    card.append(row);

    if (opened.has(item.key) && item.programs.length > 1) {
      const sub = el('div', 'sub');

      for (const program of item.programs) {
        const line = el('div', 'subline');

        const programText = program.km +
          (
            program.date
              ? '\nNgày CT: ' + program.date
              : ''
          ) +
          (
            program.newToday
              ? ' · CT mới hôm nay'
              : ''
          );

        line.append(
          check(
            selected.has(program.id),
            () => {
              if (selected.has(program.id)) {
                selected.delete(program.id);
              } else {
                selected.add(program.id);
              }

              render();
            },
            'Chọn ' + item.model + ' ' + money(program.price)
          ),
          el(
            'div',
            'subprice' + (
              program.price === item.min ? ' best' : ''
            ),
            money(program.price)
          ),
          el('div', 'program', programText),
          button(
            '📋 Copy',
            () => copyText(singleText(item, program))
          )
        );

        sub.append(line);
      }

      card.append(sub);
    }

    fragment.append(card);
  }

  if (!visible.length) {
    fragment.append(
      el(
        'div',
        'empty',
        'Không có sản phẩm phù hợp. Thử đổi từ khóa hoặc bộ lọc tồn.'
      )
    );
  }

  $('list').replaceChildren(fragment);
  $('count').textContent = selected.size;

  const allSelected = visible.length > 0 &&
    visible.every(item => selected.has(item.default.id));

  $('selectAll').textContent = allSelected
    ? 'Bỏ chọn tất cả'
    : 'Chọn tất cả';

  $('status').classList.remove('error');

  $('status').textContent =
    visible.length + '/' + items.length +
    ' sản phẩm · Đồng bộ ' + lastSync +
    ' · Giá đại diện ưu tiên CT có chữ “lẻ”, nếu không có lấy giá cao nhất. ' +
    loadNote;
}

function singleText(item, program) {
  return item.model + ' · ' + item.name +
    ' — Giá: ' + money(program.price) +
    (
      program.km === '-'
        ? ''
        : ' — CT: ' + program.km
    );
}

async function copyText(text) {
  try {
    if (!navigator.clipboard?.writeText) {
      throw Error('Clipboard không khả dụng');
    }

    await navigator.clipboard.writeText(text);
    toast('Đã copy báo giá');
  } catch {
    $('manualText').value = text;
    $('manual').showModal();
    $('manualText').focus();
    $('manualText').select();
  }
}

function copySelected() {
  const groups = new Map();

  for (const item of items) {
    for (const program of item.programs) {
      if (!selected.has(program.id)) continue;

      const label = program.km === '-'
        ? 'BÁO GIÁ'
        : program.km;

      if (!groups.has(label)) groups.set(label, []);

      groups.get(label).push(
        item.model + ' · ' + item.name +
        ' — ' + money(program.price)
      );
    }
  }

  if (!groups.size) {
    toast('Chọn ít nhất một mức giá');
    return;
  }

  let text = '📣 BÁO GIÁ VIỆT TUẤN\n';

  for (const [label, lines] of groups) {
    text += '\n' + label + '\n' +
      lines.map(line => '• ' + line).join('\n') + '\n';
  }

  copyText(text.trim());
}

for (const name of [
  'Tất cả',
  'Panasonic',
  'Daikin',
  'Toshiba',
  'Sharp',
  'Electrolux',
  'Hitachi',
  'Aufit',
  'Sanaky'
]) {
  $('chips').append(
    button(
      name,
      event => {
        brand = name === 'Tất cả' ? '' : name;

        for (const chip of $('chips').children) {
          chip.classList.toggle(
            'active',
            chip === event.currentTarget
          );
        }

        filter();
      },
      name === 'Tất cả' ? 'active' : ''
    )
  );
}

$('search').addEventListener('input', filter);
$('stockFilter').addEventListener('change', filter);
$('reload').addEventListener('click', load);
$('copySelected').addEventListener('click', copySelected);

$('reset').addEventListener('click', () => {
  selected.clear();
  render();
});

$('selectAll').addEventListener('click', () => {
  const allSelected = visible.length > 0 &&
    visible.every(item => selected.has(item.default.id));

  for (const item of visible) {
    if (allSelected) {
      item.programs.forEach(program => {
        selected.delete(program.id);
      });
    } else {
      selected.add(item.default.id);
    }
  }

  render();
});

$('closeManual').addEventListener('click', () => {
  $('manual').close();
});

$('cancelSpec').addEventListener('click', () => {
  $('specDialog').close();
});

$('saveSpec').addEventListener('click', () => {
  if (!editing) return;

  const value = $('specInput').value.trim();
  const next = { ...custom };

  const oldSpecKey = String(editing.model)
    .trim()
    .toUpperCase()
    .normalize();

  delete next[oldSpecKey];

  if (value) {
    next[editing.key] = value;
  } else {
    delete next[editing.key];
  }

  try {
    localStorage.setItem(
      'CUSTOM_SPECS_CACHE',
      JSON.stringify(next)
    );
  } catch {
    toast(
      'Không lưu được trên thiết bị. Thử kiểm tra quyền lưu của trình duyệt.'
    );
    return;
  }

  custom = next;
  editing.spec = value || editing.sheetSpec;

  $('specDialog').close();
  filter();
});

load();
</script>
</body>
</html>
