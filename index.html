<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Việt Tuấn · Đăng nhập Admin</title><link rel="stylesheet" href="/style.css"><script type="module" src="/login.js"></script></head><body>
<main id="login"><div class="brand">VT · VIỆT TUẤN</div><h1>Đăng nhập quản trị</h1><p>Truy cập dữ liệu bán hàng và chương trình đại lý.</p><form id="login-form"><label>Tài khoản<input name="username" value="Admin" autocomplete="username" required maxlength="80"></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><label>Mã xác thực 2 bước <small>(nếu đã bật)</small><input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label><button>Đăng nhập</button></form><p id="message" role="status"></p></main>
<section id="workspace" hidden><header><span id="save-state" role="status"></span><details class="account-menu"><summary>Tài khoản</summary><div><button id="change-password">Đổi mật khẩu</button><button id="logout">Đăng xuất</button></div></details></header><iframe id="app" title="Ứng dụng Việt Tuấn"></iframe></section>
<dialog id="password-dialog"><h2>Đổi mật khẩu Admin</h2><form id="password-form"><label>Mật khẩu hiện tại<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="256"></label><label>Mật khẩu mới (ít nhất 15 ký tự)<input name="password" type="password" autocomplete="new-password" required minlength="15" maxlength="256"></label><label>Mã xác thực 2 bước<input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button>Lưu mật khẩu mới</button></form><p id="password-message" role="status"></p><button id="cancel-password">Đóng</button></dialog>
</body></html>
