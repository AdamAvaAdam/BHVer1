function programKey(p){return String(p.km||'-').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();}

 for(const item of current){const before=old.get(item.key);item.hasPriceChange=false;item.removedPrograms=0;
  for(const p of item.programs){
   if(!before){p.comparison={text:'Mã mới',changed:true};continue;}
   const same=before.programs.filter(q=>programKey(q)===programKey(p));
   const currentSame=item.programs.filter(q=>programKey(q)===programKey(p));
   if(!same.length){p.comparison={text:'CT mới',changed:true};continue;}

   }

}

function parseCSV(text){

}

function quality(){let h=state.history;if(!h)return 'Đang chờ đơn hàng và bảng giá để đối chiếu mã.';let x=state.orderInfo||{},parts=[`Khớp ${h.mapped.length}/${h.total} dòng đơn với mã trong bảng giá; ${h.unmatched} dòng chưa khớp được loại khỏi chấm mã.`];if(h.latest)parts.push('Ngày đơn gần nhất: '+h.latest.split('-').reverse().join('/'));if(x.adjustments)parts.push(x.adjustments+' dòng giảm giá/điều chỉnh/trả hàng không dùng làm tín hiệu nhu cầu');if(x.invalid)parts.push(x.invalid+' dòng lỗi đã bỏ qua');if(x.future)parts.push(x.future+' dòng ngày tương lai bị loại');if(x.limited)parts.push('Nguồn đạt giới hạn 20.000 dòng: phân tích có thể chưa đầy đủ');return parts.join(' · ');}
function recordFeedback(rec,result){let entry={time:new Date().toISOString(),customer:state.selected,customerName:selectedName(),model:rec.item.model,result,score:rec.score,historyDays:state.windowDays,region:state.region,sourceDate:state.history?.latest||null};let next=[...feedback,entry];try{localStorage.setItem('VT_ADVISOR_FEEDBACK',JSON.stringify(next));feedback=next;toast('Đã ghi nhận kết quả chào hàng trên thiết bị');renderAdvisor();}catch{toast('Không lưu được phản hồi; vui lòng kiểm tra bộ nhớ trình duyệt');}}
function privatePrice(p){return /khong gui gia|bao mom|gia noi bo/.test(E.normalize(p.default.km));}
function draft(rec){let c=rec.item,history=rec.personal?`Em thấy bên mình có nhập ${c.model} gần đây, anh/chị đang còn hàng mã này không ạ?`:`Em gửi anh/chị tham khảo mã ${c.model} · ${c.name}.`;let weather=rec.weather.points?' '+rec.weather.reason.replace(/:.*$/,'')+' ở '+state.region+', mình xem có phù hợp nhu cầu khách khu vực không ạ?':'';return `Chào anh/chị ${selectedName()},\n${history}${weather}\n${privatePrice(c)?c.model+' · '+c.name+' — Chương trình cần trao đổi trực tiếp, em sẽ liên hệ để tư vấn giá.':singleText(c,c.default)}\n${typeof c.stock==='number'?'Kho đang báo còn '+c.stock+' sản phẩm.':'Kho đang báo có hàng, em sẽ xác nhận số lượng trước khi chốt.'}\nAnh/chị cho em xin số lượng dự kiến để em kiểm tra hàng và chương trình phù hợp nhé.`;}
function renderAdvisor(){if(!$A('advisor'))return;$A('advisorReload').disabled=state.busy;$A('advisorReload').textContent=state.busy?'Đang đọc dữ liệu…':'↻ Phân tích lại';$A('advisorLocationNote').textContent=state.selected?selectedName()+' · '+state.regionFrom:'Chọn đại lý để xem gợi ý riêng.';$A('advisorSources').textContent=state.ordersStatus+' · '+state.customersStatus+(items.length?' · '+items.length+' mã trong bảng giá đang mở':' · Đang chờ bảng giá và tồn');renderWeather();state.history=E.buildHistory(state.orders,items);state.history.sourceStale=state.ordersFresh===false;$A('advisorQuality').textContent=quality();let cards=$A('advisorRecommendations');cards.replaceChildren();
if(!state.selected||!items.length||!state.orders.length){cards.append(el('div','advisor-empty',state.busy?'Đang kết nối nguồn đơn hàng…':!items.length?'Chưa có bảng giá/tồn để tư vấn. Kiểm tra trạng thái nguồn báo giá bên dưới.':'Chọn đại lý và tải nguồn đơn hàng để bắt đầu.'));state.recommendations=[];return;}
let rankings=E.rank(items,state.history,state.selected,state.weather,state.windowDays);state.recommendations=rankings;
for(let [index,rec]of rankings.entries()){let p=rec.item,card=el('article','advisor-rec'),head=el('div','advisor-rec-head');head.append(el('span','advisor-rank','#'+(index+1)+' · '+rec.tier),el('b','advisor-score',rec.score+'/100'));card.append(head,el('h4',null,p.model),el('div','advisor-product-name',p.name));let meta=el('div','advisor-meta');meta.append(el('strong',null,money(p.default.price)),el('span',null,'Kho: '+(p.stock==='Có'?'có hàng — cần hỏi SL':p.stock)));card.append(meta,el('div','advisor-note','Giá theo CT: '+p.default.km));let reasons=el('ul','advisor-reasons');for(let r of rec.reasons)reasons.append(el('li',null,r));if(/dan lanh|dan nong/.test(E.normalize(p.name)))reasons.append(el('li',null,'Dàn nóng/lạnh: kiểm tra đủ bộ trước khi chào.'));card.append(reasons);let parts=el('details','advisor-breakdown');parts.append(el('summary',null,'Xem cách tính điểm'),el('p',null,`Khách ${rec.parts.customer}/35 · Lặp lại ${rec.parts.repeat}/15 · Toàn nguồn ${rec.parts.market}/20 · Xu hướng ${rec.parts.trend}/5 · Thời tiết ${rec.parts.weather}/15 · Tồn ${rec.parts.stock}/10`));card.append(parts);let tools=el('div','advisor-actions');tools.append(button('＋ Thêm vào báo giá',()=>{if(loading)return toast('Chờ bảng giá tải xong');if(privatePrice(p))return toast('Chương trình yêu cầu trao đổi trực tiếp, không thêm giá vào tin nhắn');let live=items.find(i=>i.key===p.key);if(!live)return toast('Mã không còn trong bảng giá mới');selected.add(live.default.id);render();toast('Đã thêm '+live.model+' vào báo giá');}),button(privatePrice(p)?'📋 Soạn lời chào không kèm giá':'📋 Soạn lời chào',()=>copyText(draft(rec))),button('Tìm trong bảng giá',()=>{$('search').value=p.model;$('stockFilter').value='all';brand='';onlyChanges=false;$('changesOnly').setAttribute('aria-pressed','false');$('changesOnly').classList.remove('primary');for(let [i,b]of [...$('chips').children].entries())b.classList.toggle('active',i===0);filter();$('search').scrollIntoView({behavior:'smooth',block:'start'});}));card.append(tools);let result=el('div','advisor-feedback');result.append(el('span',null,'Kết quả chào:'),button('Đã chốt',()=>recordFeedback(rec,'won')),button('Chưa mua',()=>recordFeedback(rec,'not_now')));card.append(result);cards.append(card);}
if(!rankings.length)cards.append(el('div','advisor-empty','Chưa có mã còn hàng khớp lịch sử hoặc có tín hiệu thời tiết. Không đủ cơ sở xếp hạng; hãy kiểm tra mã tồn và tên sản phẩm trong nguồn.'));$A('advisorFeedbackCount').textContent=feedback.length+' phản hồi lưu trên thiết bị; dùng để đánh giá gợi ý, chưa phải mô hình xác suất.';}
$A('advisorDealer').addEventListener('change',()=>{let d=dealers().find(d=>E.normalize(d.name)===E.normalize($A('advisorDealer').value));if(!d){state.selected='';state.region='';state.weather=null;state.regionFrom='Hãy chọn đúng tên trong danh sách';state.generation++;$A('advisorRegion').value='';renderAdvisor();return;}state.selected=d.id;try{localStorage.setItem('VT_ADVISOR_LAST_DEALER',d.id);}catch{}resolveRegion();renderAdvisor();loadWeather();});
$A('advisorRegion').addEventListener('change',()=>{if(!state.selected){toast('Chọn đại lý trước khi đổi tỉnh');$A('advisorRegion').value='';return;}let value=$A('advisorRegion').value;let next={...overrides};if(value)next[state.selected]=value;else delete next[state.selected];try{localStorage.setItem('VT_ADVISOR_REGIONS',JSON.stringify(next));overrides=next;resolveRegion();renderAdvisor();loadWeather();}catch{toast('Không lưu được tỉnh trên thiết bị');}});
$A('advisorWindow').addEventListener('change',()=>{state.windowDays=Number($A('advisorWindow').value);renderAdvisor();});
$A('advisorReload').addEventListener('click',loadAdvisor);
$A('advisorExport').addEventListener('click',()=>{let content=JSON.stringify({format:'viet-tuan-sales-feedback',version:1,exportedAt:new Date().toISOString(),feedback},null,2),url=URL.createObjectURL(new Blob([content],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='phan-hoi-chao-hang-'+E.currentDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
const originalRender=render;render=function(){originalRender();renderAdvisor();};
renderAdvisor();loadAdvisor();
setInterval(()=>{if(!document.hidden&&!state.busy)loadAdvisor();},300000);
})();

</script>
