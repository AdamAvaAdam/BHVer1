function safeImageLink(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:null;}catch{return null;}}
function imageURL(link){const u=new URL(link);if(u.hostname==='drive.google.com'){const id=u.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)?.[1]||u.searchParams.get('id');if(id&&/^[a-zA-Z0-9_-]+$/.test(id))return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600';}return link;}

async function copyProductImage(item){const link=imageLinks[item.key];if(!link)return;try{if(!navigator.clipboard?.write||typeof ClipboardItem==='undefined')throw Error();const response=await fetch(imageURL(link));if(!response.ok)throw Error();const blob=await response.blob();if(!blob.type.startsWith('image/'))throw Error();const bitmap=await createImageBitmap(blob);const canvas=document.createElement('canvas');const scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw Error();await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);toast('Đã copy ảnh. Dán vào Zalo, sau đó copy giá để gửi tiếp.');}catch{window.open(link,'_blank','noopener,noreferrer');toast('Không copy ảnh trực tiếp được. Mở ảnh để tải hoặc sao chép rồi gửi Zalo.');}}

function readPriceTabs(url){return new Promise((resolve,reject)=>{
 const callback='vtTabs_'+Date.now()+'_'+Math.floor(Math.random()*1000000), script=document.createElement('script');
 let timer;const cleanup=()=>{clearTimeout(timer);script.remove();delete window[callback];};
 window[callback]=data=>{cleanup();if(!data?.ok)return reject(Error(data?.error||'Nguồn tự động trả dữ liệu không hợp lệ'));resolve(data);};
 script.onerror=()=>{cleanup();reject(Error('Không kết nối được Apps Script. Kiểm tra triển khai và quyền truy cập.'));};
 timer=setTimeout(()=>{cleanup();reject(Error('Nguồn tự động quá thời gian chờ.'));},25000);
 const u=new URL(url);u.searchParams.set('callback',callback);u.searchParams.set('_',Date.now());script.src=u.href;document.head.append(script);
});}
async function resolveSources(){

function programKey(p){return String(p.km||'-').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();}
function comparePrices(current,previous){
 const old=new Map(previous.map(i=>[i.key,i]));
 for(const item of current){const before=old.get(item.key);item.hasPriceChange=false;item.removedPrograms=0;
  for(const p of item.programs){
   if(!before){p.comparison={text:'Mã mới',changed:true};continue;}
   const same=before.programs.filter(q=>programKey(q)===programKey(p));
   const currentSame=item.programs.filter(q=>programKey(q)===programKey(p));
   if(!same.length){p.comparison={text:'CT mới',changed:true};continue;}
   if(same.length!==1||currentSame.length!==1){
    const a=same.map(q=>q.price).sort((x,y)=>x-y),b=currentSame.map(q=>q.price).sort((x,y)=>x-y);
    const changed=JSON.stringify(a)!==JSON.stringify(b);
    p.comparison={text:changed?'Nhiều mức cùng CT · cần đối chiếu':'Không đổi · nhiều mức cùng CT',changed};continue;
   }
   const delta=p.price-same[0].price;
   p.comparison={text:delta===0?'Không đổi':(delta<0?'↓ ':'↑ ')+money(Math.abs(delta))+' · Cũ: '+money(same[0].price),changed:delta!==0};
  }
  if(before){const labels=new Set(item.programs.map(programKey));item.removedPrograms=new Set(before.programs.filter(p=>!labels.has(programKey(p))).map(programKey)).size;}
  item.hasPriceChange=item.programs.some(p=>p.comparison.changed)||item.removedPrograms>0;
  item.change=item.removedPrograms?'Bớt '+item.removedPrograms+' CT so với bảng trước':'';
 }
 return previous.filter(i=>!current.some(n=>n.key===i.key)).length;
}

function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell.trim());cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';}else cell+=c;}
 if(quoted)throw Error('CSV có ô chưa đóng dấu ngoặc kép');row.push(cell.trim());if(row.some(Boolean))rows.push(row);if(rows[0])rows[0][0]=rows[0][0].replace(/^\uFEFF/,'');return rows;
}
function stockNumber(s){let t=String(s??'').trim().replace(/\s/g,'');if(!t)return null;if(fold(t)==='co')return 'Có';if(!/^-?[\d.,]+$/.test(t))return null;if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');else if(t.includes(','))t=t.replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const n=Number(t);return Number.isFinite(n)?n:null;}
function priceNumber(s){const t=String(s??'').trim();if(!/^\d[\d.,\s]*(?:đ|₫|vnd)?$/i.test(t))return null;const n=Number(t.replace(/[^\d]/g,''));return Number.isSafeInteger(n)&&n>0?n:null;}
function isToday(s){const m=String(s).match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})(?:\s|$)/);if(!m)return false;const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date()).split('/');return +m[1]===+parts[0]&&+m[2]===+parts[1]&&(+m[3]<100?2000+(+m[3]):+m[3])===+parts[2];}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function button(text,fn,cls){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b;}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2600);}
async function fetchCSV(url){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const t=await r.text();if(/^\s*</.test(t))throw Error('Nguồn không trả về CSV');return parseCSV(t);}finally{clearTimeout(timer);}}
function buildData(stockRows,priceRows,specRows){
 const stocks=new Map(),specs=new Map(),groups=new Map();let invalid=0,duplicates=0;
 for(const c of stockRows.slice(1)){const k=key(c[0]);if(!k)continue;const n=stockNumber(c[3]);if(stocks.has(k)){stocks.set(k,null);duplicates++;}else stocks.set(k,n);}
 for(const c of specRows.slice(1)){if(key(c[0]))specs.set(key(c[0]),c[2]||'');}
 const occurrences=new Map();
 for(const c of priceRows){const k=key(c[0]);if(!k||!c[1])continue;const price=priceNumber(c[5]);if(price===null){invalid++;continue;}const name=c[1]||c[0],km=c[8]||'-',date=c[6]||'';
 const signature=JSON.stringify([k,price,km,date]);const occurrence=(occurrences.get(signature)||0)+1;occurrences.set(signature,occurrence);
 const p={id:signature+'#'+occurrence,price,km,date,newToday:isToday(date)};
 if(!groups.has(k))groups.set(k,{key:k,model:c[0],name,stock:stocks.has(k)?stocks.get(k):null,sheetSpec:specs.get(k)||'',programs:[]});groups.get(k).programs.push(p);
 }
 for(const i of groups.values()){i.programs.sort((a,b)=>b.price-a.price);i.default=i.programs.find(p=>fold(p.km).includes('le'))||i.programs[0];i.min=Math.min(...i.programs.map(p=>p.price));i.spec=custom[i.key]||custom[String(i.model).trim().toUpperCase().normalize()]||i.sheetSpec;}
 return {data:[...groups.values()],invalid,duplicates};
}
async function load(){
 if(loading)return;loading=true;$('reload').disabled=true;$('copySelected').disabled=true;$('status').textContent='Đang tìm bảng mới nhất và cập nhật giá, tồn…';
 try{
 const sources=await resolveSources();
 const results=await Promise.allSettled([fetchCSV(sources.stock),fetchCSV(sources.price),fetchCSV(SOURCES.specs),sources.previous?fetchCSV(sources.previous):Promise.resolve(null)]);
 if(results[0].status==='rejected'||results[1].status==='rejected')throw Error('Không tải được tồn hoặc bảng giá mới. Kiểm tra quyền xem công khai của file Sheets.');
 const specFailed=results[2].status==='rejected',built=buildData(results[0].value,results[1].value,specFailed?[]:results[2].value);
 if(!built.data.length)throw Error('Bảng mới chưa có dòng giá hợp lệ. Hoàn thiện bảng rồi bấm MỚI.');
 let comparisonNote='';
 if(sources.previous){
  if(results[3].status==='rejected')comparisonNote='Chưa tải được bảng trước: tạm không so sánh.';
  else{const previous=buildData([],results[3].value,[]).data;if(!previous.length)comparisonNote='Bảng trước không có giá hợp lệ: tạm không so sánh.';else{const removed=comparePrices(built.data,previous);comparisonNote=removed?removed+' mã không còn trong bảng mới.':'';}}
 }else comparisonNote='Chưa có dữ liệu so sánh ngày trước.';
 const old=new Map(items.map(i=>[i.key,i]));for(const i of built.data){if(old.has(i.key)&&old.get(i.key).stock!==i.stock)i.change=[i.change,'Tồn đổi từ lần tải trước'].filter(Boolean).join(' · ');}
 const hadSelection=selected.size>0;items=built.data;selected.clear();opened.clear();sourceDescription=sources.description;
 lastSync=new Date().toLocaleTimeString('vi-VN',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'});
 loadNote=[comparisonNote,specFailed?'Chưa tải được thông số.':'',built.invalid?built.invalid+' dòng giá không hợp lệ đã bỏ qua.':'',built.duplicates?'Có mã tồn trùng: tạm ghi chưa rõ tồn.':''].filter(Boolean).join(' ');
 if(onlyChanges&&!items.some(i=>i.programs.some(p=>p.comparison))){onlyChanges=false;$('changesOnly').setAttribute('aria-pressed','false');}
 filter();if(hadSelection)toast('Đã cập nhật. Lựa chọn cũ được bỏ để tránh báo nhầm.');
 }catch(e){$('status').textContent=e.message+(items.length?' · Giữ dữ liệu cũ: '+sourceDescription+' · '+lastSync: ' · Chưa đổi sang nguồn mới.');$('status').classList.add('error');if(!items.length)$('list').replaceChildren(el('div','empty','Chưa tải được dữ liệu. Kiểm tra nguồn tự động và quyền xem Sheets.'));}
 finally{loading=false;$('reload').disabled=false;$('copySelected').disabled=false;}
}
function filter(){const words=fold($('search').value).trim().split(/\s+/).filter(Boolean);visible=items.filter(i=>{const target=fold([i.model,i.name,i.spec,...i.programs.map(p=>p.km)].join(' '));return (!onlyChanges||i.hasPriceChange)&&words.every(w=>target.includes(w)||compact(i.model).includes(compact(w))&&compact(w)!=='')&&(!brand||target.includes(fold(brand)))&&($('stockFilter').value==='all'||($('stockFilter').value==='unknown'?i.stock===null:i.stock==='Có'||(i.stock!==null&&i.stock>0)));});render();}
function toggle(i){if(i.programs.some(p=>selected.has(p.id)))i.programs.forEach(p=>selected.delete(p.id));else selected.add(i.default.id);render();}
function check(checked,fn,label){const c=el('input','check');c.type='checkbox';c.checked=checked;c.setAttribute('aria-label',label);c.addEventListener('change',fn);return c;}
function render(){const fragment=document.createDocumentFragment();for(const i of visible){const any=i.programs.some(p=>selected.has(p.id)),card=el('article','card'+(any?' selected':'')),row=el('div','row');const mainCheck=check(any,()=>toggle(i),'Chọn '+i.model);mainCheck.indeterminate=any&&!selected.has(i.default.id);row.append(mainCheck);const info=el('div');info.append(el('div','model',i.model),el('div','name',i.name));if(i.spec)info.append(el('div','spec',i.spec));if(i.change)info.append(el('span','badge',i.change));const tools=el('div','tools');if(i.programs.length>1)tools.append(button((opened.has(i.key)?'▴ Ẩn':'▾ Xem')+' '+i.programs.length+' mức giá',()=>{opened.has(i.key)?opened.delete(i.key):opened.add(i.key);render();}));tools.append(button('Thông số',()=>{editing=i;$('specTitle').textContent='Thông số · '+i.model;$('specInput').value=i.spec;$('specDialog').showModal();}));tools.append(button(imageLinks[i.key]?'✏️ Đổi ảnh':'＋ Ảnh của tôi',()=>editImage(i)));if(imageLinks[i.key]){tools.append(button('📋 Copy ảnh',()=>copyProductImage(i)));const view=el('a',null,'🖼 Xem ảnh');view.href=imageLinks[i.key];view.target='_blank';view.rel='noopener noreferrer';view.style.cssText='font-size:12px;padding:6px';tools.append(view);}info.append(tools);row.append(info);row.append(el('div','stock'+(i.stock===null||i.stock<=0?' muted':''),i.stock===null?'Tồn: chưa rõ':'Tồn: '+i.stock.toLocaleString('vi-VN')));const quote=el('div','quote');quote.append(el('div','price',money(i.default.price)),el('div','program',i.default.km),button('📋 Copy giá',()=>copyText(singleText(i,i.default)),'primary'));if(i.default.comparison)quote.append(el('div','badge',i.default.comparison.text));if(i.hasPriceChange&&i.programs.some(p=>p!==i.default&&p.comparison?.changed))info.append(el('span','badge','Có CT phụ thay đổi'));row.append(quote);card.append(row);
 if(opened.has(i.key)&&i.programs.length>1){const sub=el('div','sub');for(const p of i.programs){const line=el('div','subline');line.append(check(selected.has(p.id),()=>{selected.has(p.id)?selected.delete(p.id):selected.add(p.id);render();},'Chọn '+i.model+' '+money(p.price)),el('div','subprice'+(p.price===i.min?' best':''),money(p.price)),el('div','program',p.km+(p.date?'\nNgày CT: '+p.date:'')+(p.newToday?' · CT mới hôm nay':'')),button('📋 Copy',()=>copyText(singleText(i,p))));if(p.comparison)line.querySelector('.program').append(el('div','badge',p.comparison.text));sub.append(line);}card.append(sub);}fragment.append(card);}
 if(!visible.length)fragment.append(el('div','empty','Không có sản phẩm phù hợp. Thử đổi từ khóa hoặc bộ lọc tồn.'));$('list').replaceChildren(fragment);$('count').textContent=selected.size;$('selectAll').textContent=visible.length&&visible.every(i=>selected.has(i.default.id))?'Bỏ chọn tất cả':'Chọn tất cả';$('status').classList.remove('error');$('status').textContent=visible.length+'/'+items.length+' sản phẩm · '+sourceDescription+' · Đồng bộ '+lastSync+' · Giá đại diện ưu tiên CT có chữ “lẻ”, nếu không có lấy giá cao nhất. '+loadNote;}
function singleText(i,p){return i.model+' · '+i.name+' — Giá: '+money(p.price)+(p.km==='-'?'':' — CT: '+p.km)+(imageLinks[i.key]?'\nẢnh sản phẩm: '+imageLinks[i.key]:'');}
async function copyText(text,onCopied){try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(text);if(onCopied)onCopied();toast('Đã copy báo giá');}catch{$('manualText').value=text;$('manualText').oncopy=()=>{setTimeout(()=>{if(onCopied)onCopied();$('manualText').oncopy=null;},0);};$('manual').showModal();$('manualText').focus();$('manualText').select();}}
function copySelected(){const copiedIds=new Set(selected);const groups=new Map();for(const i of items)for(const p of i.programs)if(selected.has(p.id)){const label=p.km==='-'?'BÁO GIÁ':p.km;if(!groups.has(label))groups.set(label,[]);groups.get(label).push(i.model+' · '+i.name+' — '+money(p.price)+(imageLinks[i.key]?'\n  Ảnh sản phẩm: '+imageLinks[i.key]:''));}if(!groups.size)return toast('Chọn ít nhất một mức giá');let text='📣 BÁO GIÁ VIỆT TUẤN\n';for(const [label,lines] of groups)text+='\n'+label+'\n'+lines.map(l=>'• '+l).join('\n')+'\n';copyText(text.trim(),()=>{for(const id of copiedIds)selected.delete(id);render();});}
for(const name of ['Tất cả','Panasonic','Daikin','Toshiba','Sharp','Electrolux','Hitachi','Aufit','Sanaky']){$('chips').append(button(name,e=>{brand=name==='Tất cả'?'':name;for(const b of $('chips').children)b.classList.toggle('active',b===e.currentTarget);filter();},name==='Tất cả'?'active':''));}
$('autoSource').addEventListener('click',configureAutoSource);$('changesOnly').addEventListener('click',()=>{if(!items.some(i=>i.programs.some(p=>p.comparison)))return toast('Chưa có bảng ngày trước để so sánh');onlyChanges=!onlyChanges;$('changesOnly').setAttribute('aria-pressed',String(onlyChanges));$('changesOnly').classList.toggle('primary',onlyChanges);filter();});$('search').addEventListener('input',filter);$('stockFilter').addEventListener('change',filter);$('reload').addEventListener('click',load);$('copySelected').addEventListener('click',copySelected);$('reset').addEventListener('click',()=>{selected.clear();render();});$('selectAll').addEventListener('click',()=>{const all=visible.length&&visible.every(i=>selected.has(i.default.id));for(const i of visible)if(all)i.programs.forEach(p=>selected.delete(p.id));else selected.add(i.default.id);render();});$('closeManual').addEventListener('click',()=>$('manual').close());$('cancelSpec').addEventListener('click',()=>$('specDialog').close());$('saveSpec').addEventListener('click',()=>{if(!editing)return;const value=$('specInput').value.trim();const next={...custom};delete next[String(editing.model).trim().toUpperCase().normalize()];if(value)next[editing.key]=value;else delete next[editing.key];try{localStorage.setItem('CUSTOM_SPECS_CACHE',JSON.stringify(next));}catch{return toast('Không lưu được trên thiết bị. Thử kiểm tra quyền lưu của trình duyệt.');}custom=next;editing.spec=value||editing.sheetSpec;$('specDialog').close();filter();});
load();
</script>
</html>
